<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration | Coding Conf 2026</title>
  
  <link rel="icon" href="../assets/images/favicon-32x32.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main page</a>

  <header class="site-header">
    <a href="index.html">
      <img src="../assets/images/logo-full.svg" alt="Coding Conf, home">
    </a>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="login.html" aria-current="page">Register</a>
    </nav>
  </header>

  <main id="main">
    <section class="intro" aria-labelledby="form-title">
      <h1 id="form-title">Your Journey Starts Here!</h1>
      <p class="subtitle">Secure your spot at next year's biggest coding conference.</p>
    </section>

    <section aria-label="Registration form">
      <form id="ticket-form" class="form" novalidate>
        <!-- Avatar Upload -->
        <div class="field">
          <label for="avatar">Upload Avatar</label>
          <div class="dropzone" id="dropzone">
            <img id="avatar-preview" class="avatar-preview" src="" alt="Avatar preview" hidden>
            <p id="dropzone-text" class="dropzone-text">Drag and drop or click to upload</p>
            <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg">
          </div>
          <p id="avatar-hint" class="hint">Upload your photo (JPG or PNG, max size: 500KB).</p>
          <p id="avatar-error" class="error" role="alert"></p>
        </div>

        <!-- Full Name -->
        <div class="field">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName" placeholder="e.g. Sabrina Farquharson">
          <p id="name-error" class="error" role="alert"></p>
        </div>

        <!-- Email Address -->
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="example@email.com">
          <p id="email-error" class="error" role="alert"></p>
        </div>

        <!-- GitHub Username -->
        <div class="field">
          <label for="github">GitHub Username</label>
          <input type="text" id="github" name="github" placeholder="@yourusername">
          <p id="github-error" class="error" role="alert"></p>
        </div>

        <button type="submit" class="btn">Generate My Ticket</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Coding Conf. Sabrina's project.</p>
  </footer>

  <script src="../js/validation.js" defer></script>
</body>
</html>
